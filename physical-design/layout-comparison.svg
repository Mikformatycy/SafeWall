<text x="72" y="942" class="body" >Limit średniego poboru: 5.09 W typowo / 4.80 W przy pojemności minimalnej.</text>
<text x="72" y="976" class="body" >Szacunek czasu: 4 W → 2.55 h   ·   5 W → 2.04 h   ·   6 W → 1.70 h   ·   8 W → 1.27 h</text>
<text x="48" y="1044" class="small" >Niezweryfikowane: anteny, termika, PCB, porty, luzy baterii, geometria telefonu i siła mocowania.</text>
<text x="48" y="1073" class="small" >Źródła: Raspberry Pi CM4 datasheet; EEMB LP605590-PCM-NTC-LD; Apple Accessory Design Guidelines 2026-09-21.</text>
<text x="48" y="1097" class="small" >Wspólna skala widoków. To rysunek obliczeniowy, nie zrzut z Fusion ani projekt do produkcji.</text>
