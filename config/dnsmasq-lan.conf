# Dedicated LAN DHCP/DNS. USB DHCP stays under NetworkManager.
interface=eth0
except-interface=lo
bind-dynamic
listen-address=192.168.76.1
port=53
dhcp-authoritative
dhcp-range=192.168.76.50,192.168.76.150,255.255.255.0,1h
dhcp-option=option:router,192.168.76.1
dhcp-option=option:dns-server,192.168.76.1
dhcp-leasefile=/var/lib/pi-router/dnsmasq.leases
pid-file=/run/pi-lan-dnsmasq/dnsmasq.pid
resolv-file=/run/pi-router/wan-resolv.conf
domain-needed
bogus-priv
cache-size=256
local=/pi.home.arpa/
domain=pi.home.arpa
host-record=router.pi.home.arpa,safewall,192.168.76.1
log-dhcp
log-facility=-
