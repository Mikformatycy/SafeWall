#!/usr/sbin/nft -f
# Own only this table. Never flush NetworkManager's ruleset.
destroy table inet pi_router

define usb_net = 10.12.194.0/28
define lan_net = 192.168.76.0/24

table inet pi_router {
    set wan_ifaces {
        type ifname
        comment "Active cellular uplinks, maintained by pi-router-wan"
    }
    chain input {
        type filter hook input priority filter + 10; policy drop;
        iifname "lo" accept
        ct state invalid counter drop
        ct state established,related accept
        meta l4proto { icmp, ipv6-icmp } accept
        iifname "usb0" ip saddr $usb_net tcp dport 22 counter accept comment "SSH only via USB"
        iifname { "usb0", "eth0" } udp sport 68 udp dport 67 counter accept comment "DHCP clients"
        iifname @wan_ifaces udp sport 67 udp dport 68 accept comment "Cellular DHCP if needed"
        iifname @wan_ifaces udp sport 547 udp dport 546 accept
        iifname "eth0" ip saddr $lan_net meta l4proto { tcp, udp } th dport 53 counter accept comment "LAN DNS"
        iifname "usb0" ip saddr $usb_net udp dport 5353 accept comment "USB mDNS"
        counter drop comment "Other incoming traffic blocked"
    }
    chain forward {
        type filter hook forward priority filter + 10; policy drop;
        ct state invalid counter drop
        iifname @wan_ifaces oifname "eth0" ip daddr $lan_net ct state established,related counter accept
        iifname "eth0" oifname @wan_ifaces ip saddr $lan_net counter accept comment "iPhone LAN to cellular only"
        counter drop comment "No USB forwarding or unsolicited inbound"
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
    chain postrouting {
        type nat hook postrouting priority srcnat + 10; policy accept;
        ip saddr $lan_net oifname @wan_ifaces counter masquerade comment "LAN IPv4 NAT to modem"
    }
}
