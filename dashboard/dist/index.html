<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SafeWall — Twoje połączenie, ruch sieciowy i filtr DNS w jednym miejscu.">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>SafeWall — Przegląd</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="mask-icon" href="/assets/brand/safewall-mask.svg" color="#7D67E9">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Przejdź do treści</a>
    <header class="site-header">
      <a class="brand" href="#overview" aria-label="SafeWall — przegląd">
        <span class="brand-mark" aria-hidden="true"><img src="/assets/brand/safewall-logo.svg" width="54" height="28" alt=""></span>
        <span>SafeWall</span><span class="local-label">local</span>
      </a>
      <div class="header-actions">
        <span class="source-label" id="source-name">Dane demo</span>
        <fieldset id="demo-notice" class="demo-control">
          <legend class="sr-only">Scenariusz nie zmienia ustawień routera.</legend>
          <label class="sr-only" for="scenario">Scenariusz</label>
          <select id="scenario" title="Scenariusz">
            <option value="protected">Tor połączony</option>
            <option value="weak-signal">Słabe LTE</option>
            <option value="reconnecting">Tor łączy się</option>
            <option value="offline">Brak LTE</option>
          </select>
        </fieldset>
        <button type="button" class="icon-button" id="refresh" aria-label="Odśwież dane" title="Odśwież dane"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" /></svg></button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div class="view-intro">
        <nav class="main-nav" aria-label="Nawigacja główna">
          <a href="#overview" data-page="overview" aria-current="page">Przegląd</a>
          <a href="#network" data-page="network">Połączenie</a>
          <a href="#dns" data-page="dns">Filtr DNS</a>
          <a href="#system" data-page="system">Urządzenie</a>
        </nav>
        <div class="page-heading">
          <p class="eyebrow" id="page-kicker">SafeWall One</p>
          <h1 id="page-title">Twoja sieć w jednym miejscu.</h1>
          <p class="page-description" id="page-description">Oczekiwanie na odczyty…</p>
          <div id="hero-state" class="hero-state"></div>
        </div>
        <div id="error-notice" class="error-notice" role="alert" hidden></div>
        <div id="overview-health" hidden></div>
      </div>
      <div id="content" aria-busy="true"><div class="loading-state"><span class="loading-dot"></span>Pobieranie danych…</div></div>
      <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <footer class="site-footer">
      <span id="footer-mode">Odświeżanie co 5 s</span>
      <span id="updated-at">Oczekiwanie na dane</span>
    </footer>
    <noscript><p class="error-notice">Włącz JavaScript, aby otworzyć panel SafeWall.</p></noscript>
  </body>
</html>
